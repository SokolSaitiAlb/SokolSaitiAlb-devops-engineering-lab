name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test and lint (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install development tooling
        run: python -m pip install --disable-pip-version-check -r app/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app/src app/tests
      - name: Run integration tests
        env:
          PYTHONPATH: app/src
        run: python -m unittest discover -s app/tests -v
      - name: Lint
        run: ruff check app/src app/tests

  container-build:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build image
        run: docker build --pull --file docker/Dockerfile --tag ops-notes-api:ci .
      - name: Verify image metadata
        run: docker image inspect ops-notes-api:ci --format '{{.Config.User}} {{.Config.ExposedPorts}}'
